[project]
name = "attic-backend"
version = "0.1.0"
description = "Attic - Personal analytics platform for TikTok data"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.0",
    "alembic>=1.18.0",
    "pgvector>=0.4.0",
    "pyjwt[crypto]>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
