AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Attic Media Processing Pipeline
  SAM template: SQS -> single Lambda (parse -> apify -> subtitle -> embed)

Globals:
  Function:
    Runtime: python3.13
    Timeout: 900
    MemorySize: 1024
    Architectures:
      - x86_64

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection URL

  SupabaseUrl:
    Type: String
    Description: Supabase project URL

  SupabaseServiceKey:
    Type: String
    NoEcho: true
    Description: Supabase service role key

  ApifyApiToken:
    Type: String
    NoEcho: true
    Description: Apify API token for TikTok scraping

  OpenAiApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key for embeddings

Resources:
  # ---------- S3 Bucket ----------
  TempMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "attic-temp-media-${Environment}"
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemp
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: project
          Value: attic
        - Key: environment
          Value: !Ref Environment

  # ---------- SQS Queue ----------
  UploadQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "attic-upload-queue-${Environment}"
      VisibilityTimeout: 960
      MessageRetentionPeriod: 1209600
      DelaySeconds: 0
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt UploadQueueDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: project
          Value: attic
        - Key: environment
          Value: !Ref Environment

  UploadQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "attic-upload-queue-dlq-${Environment}"
      MessageRetentionPeriod: 1209600

  # ---------- IAM Role ----------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "attic-lambda-execution-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AtticLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 access to temp bucket only
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt TempMediaBucket.Arn
                  - !Sub "${TempMediaBucket.Arn}/*"
              # SQS access to upload queue only
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt UploadQueue.Arn
      Tags:
        - Key: project
          Value: attic
        - Key: environment
          Value: !Ref Environment

  # ---------- Lambda Layer ----------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "attic-common-${Environment}"
      Description: Shared utilities and backend app for Attic Lambda functions
      ContentUri: ../src/lambdas/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: makefile

  # ---------- CloudWatch Log Group ----------
  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/attic-pipeline-${Environment}"
      RetentionInDays: 14
      Tags:
        - Key: project
          Value: attic
        - Key: environment
          Value: !Ref Environment

  # ---------- Pipeline Lambda ----------
  PipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "attic-pipeline-${Environment}"
      Handler: handler.handler
      CodeUri: ../src/lambdas/pipeline/
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          TEMP_BUCKET: !Sub "attic-temp-media-${Environment}"
          DATABASE_URL: !Ref DatabaseUrl
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          APIFY_API_TOKEN: !Ref ApifyApiToken
          OPENAI_API_KEY: !Ref OpenAiApiKey
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt UploadQueue.Arn
            BatchSize: 1

Outputs:
  TempMediaBucketName:
    Description: S3 bucket for temporary media storage
    Value: !Ref TempMediaBucket
    Export:
      Name: !Sub "${AWS::StackName}-TempMediaBucket"

  TempMediaBucketArn:
    Description: S3 bucket ARN for temporary media storage
    Value: !GetAtt TempMediaBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TempMediaBucketArn"

  UploadQueueUrl:
    Description: SQS queue URL for upload triggers
    Value: !Ref UploadQueue
    Export:
      Name: !Sub "${AWS::StackName}-UploadQueueUrl"

  UploadQueueArn:
    Description: SQS queue ARN for upload triggers
    Value: !GetAtt UploadQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UploadQueueArn"

  PipelineFunctionArn:
    Description: Pipeline Lambda function ARN
    Value: !GetAtt PipelineFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PipelineFunctionArn"

  LambdaExecutionRoleArn:
    Description: IAM role ARN for Lambda functions
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaExecutionRoleArn"
