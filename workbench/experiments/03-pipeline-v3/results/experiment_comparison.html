asizes high-volume repetition, requiring 100 successful reps of each drill before advancing. The steps move from stationary pound dribbles to high dribbles, lateral 'windshield wiper' dribbles, and finally dribbling while in motion. The video serves as a practical guide for players looking to eliminate a common weakness in their ball-handling skills.", "entities": [{"name": "Patty Oghoops", "type": "person", "rel": "primary"}, {"name": "Pound Dribble", "type": "technique", "rel": "primary"}, {"name": "High Dribble", "type": "technique", "rel": "primary"}, {"name": "Windshield Wiper Dribble", "type": "technique", "rel": "primary"}, {"name": "Hollyland Lark M1", "type": "product", "rel": "supporting"}], "audio": "Generic upbeat lo-fi hip hop beat", "takeaways": ["Mastering the left hand requires high-volume repetition (100 reps per drill) to build muscle memory.", "Dribbling skill should be built progressively: starting with stationary control before moving to dynamic movement."], "topic": "sports", "topic2": "education", "genre": "tutorial", "affect": [{"label": "informative", "tier": "dominant"}], "cost": 0.00287}, "b": {"summary": "This video provides a 4-step tutorial for beginners to improve their left-hand basketball dribbling skills. The creator demonstrates each step, starting with stationary 'pound dribbles' and progressing to dribbling above the head, moving back and forth, and finally dribbling on the move. The main point is that by following this progression, users can significantly enhance their left-hand dribble.", "entities": [{"name": "Basketball", "type": "product", "rel": "primary"}, {"name": "Left-hand dribble", "type": "technique", "rel": "primary"}, {"name": "Dribbling", "type": "technique", "rel": "primary"}, {"name": "Nike", "type": "brand", "rel": "background"}, {"name": "Ralph Lauren", "type": "brand", "rel": "background"}], "audio": null, "takeaways": ["A four-step dribbling progression can effectively improve a beginner's left-hand basketball dribble."], "topic": "sports", "topic2": "education", "genre": "tutorial", "affect": [{"label": "informative", "tier": "dominant"}], "grounding": 0, "cost": 0.00377}}, {"id": "7408508364566596882", "collection": "Golf", "caption": "If i just started golf. Part 1\n\nThinking back, i think if i fixed my swing in this order, i would have saved myself alot of time. \n\n1. Grip - changing the grip later is such a pain, so just start with a neutral grip and if needed you can adjust slightly as you get better. Yes you can play good golf with a strong or weak grip, but better to start as neutral. \n\n2. Setup - im sure youve seen it too. The guy on the first tee with the odd setup. You know the swing is going to be just as odd, and it almost has to be. \n\nI think setup is important because It means less adjustments you have to do in the swing to get to a good impact position. \n\n3. Swaying - so hard to have a good consistent swing with \u2018alot\u2019 of swaying on the backswing. It just puts you in a position to do a whole lot of bad things. \n\n4. Early extension - think ive talked about this enough\n\n#golf #golfswing #\uace8\ud504 ", "thumbnail": "https://p16-common-sign.tiktokcdn-us.com/tos-alisg-p-0037/f1a6c55b98b544b28fa1c81746155382_1724927776~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=5p1De4Y7dp5bCAXOxTKXDlMl%2F0I%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast5", "url": "https://www.tiktok.com/@x/video/7408508364566596882", "a": {"summary": "In this tutorial, creator @bay_jark shares the three most important fundamentals for beginner golfers to master early. He emphasizes starting with a neutral grip held in the fingers, establishing a proper setup posture (bending at hips, flexed knees, hanging arms), and avoiding 'swaying' by rotating the hips instead of sliding them laterally. The video concludes with a brief mention of 'early extension' as a fourth critical area to watch. The main goal is to build a solid foundation to avoid difficult-to-fix habits later in one's golf journey.", "entities": [{"name": "Golf", "type": "technique", "rel": "primary"}, {"name": "Neutral Grip", "type": "technique", "rel": "primary"}, {"name": "Golf Setup", "type": "technique", "rel": "primary"}, {"name": "Swaying", "type": "technique", "rel": "primary"}, {"name": "Early Extension", "type": "technique", "rel": "supporting"}, {"name": "Hundreds & Thousands", "type": "song", "rel": "supporting"}], "audio": "Hundreds & Thousands", "takeaways": ["Beginners should start with a neutral grip because changing a strong or weak grip later is difficult.", "A golfer's skill level can often be identified just by their setup posture.", "Swaying (sliding the hips) is a major swing killer; the right hip should rotate back and around during the backswing."], "topic": "sports", "topic2": "education", "genre": "tutorial", "affect": [{"label": "informative", "tier": "dominant"}], "cost": 0.00401}, "b": {"summary": "This video offers crucial golf swing advice for beginners, highlighting three fundamental areas: grip, setup, and swaying, with an additional tip on early extension. The creator demonstrates how to achieve a neutral grip, maintain proper posture during setup by bending at the hips with slight knee flex and relaxed arms, and minimize hip sway during the backswing to ensure consistent impact. The core message emphasizes that mastering these foundational techniques early in one's golf journey can significantly enhance performance and prevent the development of detrimental habits.", "entities": [{"name": "Golf", "type": "sport", "rel": "primary"}, {"name": "Golf swing", "type": "technique", "rel": "primary"}, {"name": "Grip", "type": "technique", "rel": "primary"}, {"name": "Setup", "type": "technique", "rel": "primary"}, {"name": "Swaying", "type": "technique", "rel": "primary"}, {"name": "Early Extension", "type": "technique", "rel": "supporting"}, {"name": "Golf club", "type": "product", "rel": "primary"}, {"n ineering requirements, showing the end-to-end flow of a professional tech meeting.", "entities": [{"name": "Tiffany", "type": "person", "rel": "primary"}, {"name": "Product Manager", "type": "person", "rel": "primary"}, {"name": "Product Designer", "type": "person", "rel": "supporting"}, {"name": "PRD", "type": "app_or_tool", "rel": "supporting"}, {"name": "Engineering", "type": "person", "rel": "supporting"}], "audio": "null", "takeaways": ["Design reviews for large features are iterative and require thoughtful back-and-forth over several weeks.", "It is healthy for PMs and Designers to disagree because they prioritize different aspects: PMs focus on customer use cases while Designers focus on us", "Effective meetings must end with clear action items and an explanation of how design choices impact engineering timelines."], "topic": "career", "topic2": "technology", "genre": "tutorial", "affect": [{"label": "informative", "tier": "dominant"}, {"label": "neutral", "tier": "secondary"}], "cost": 0.00434}, "b": {"summary": "This video, created by @tiffanysopenbook, offers a 10-step guide for product managers on how to conduct an effective design review for a new feature. It captures \"unglamourized\" moments from a real product manager and designer team discussion, emphasizing the iterative and collaborative nature of product development. The creator highlights the importance of fostering friendly conversation, asking detailed questions about design intent, and ensuring all stakeholders are aligned on customer use cases and timelines. The video serves as a practical tutorial for product managers aiming to improve their meeting productivity and design review skills.", "entities": [{"name": "Product Management", "type": "technique", "rel": "primary"}, {"name": "Product Manager", "type": "person", "rel": "primary"}, {"name": "Product Design", "type": "technique", "rel": "primary"}, {"name": "Designer", "type": "person", "rel": "primary"}, {"name": "Product Development", " avors.", "entities": [{"name": "Fattoush", "type": "recipe", "rel": "primary"}, {"name": "Romaine Lettuce", "type": "ingredient", "rel": "primary"}, {"name": "Radish", "type": "ingredient", "rel": "primary"}, {"name": "Persian Cucumber", "type": "ingredient", "rel": "primary"}, {"name": "Red Bell Pepper", "type": "ingredient", "rel": "primary"}, {"name": "Cherry Tomato", "type": "ingredient", "rel": "primary"}, {"name": "Green Onion", "type": "ingredient", "rel": "primary"}, {"name": "Fresh Mint", "type": "ingredient", "rel": "primary"}, {"name": "Fresh Parsley", "type": "ingredient", "rel": "primary"}, {"name": "Lemon Juice", "type": "ingredient", "rel": "primary"}, {"name": "Olive Oil", "type": "ingredient", "rel": "primary"}, {"name": "Sumac", "type": "ingredient", "rel": "primary"}, {"name": "Garlic", "type": "ingredient", "rel": "primary"}, {"name": "Salt", "type": "ingredient", "rel": "primary"}, {"name": "Pomegranate Molasses", "type": "ingredient", "rel": "primary"}, {"name": "Pita Bread", "type": "ingredient", "rel": "primary"}, {"name": "Za'atar", "type": "ingredient", "rel": "primary"}, {"name": "Dried Mint", "type": "ingredient", "rel": "primary"}, {"name": "Mandoline Slicer", "type": "app_or_tool", "rel": "supporting"}, {"name": "Microplane Grater", "type": "app_or_tool", "rel": "supporting"}, {"name": "Apple Watch Ultra", "type": "product", "rel": "background"}, {"name": "Ramadan Chronicles", "type": "cultural_reference", "rel": "background"}], "audio": null, "takeaways": ["Fattoush is a top-tier salad that is not lettuce-dominant and offers a variety of textures.", "Using Persian-style cucumbers is essential for this Fattoush recipe.", "Adding tomatoes on top of firmer vegetables helps prevent the lettuce from becoming soggy.", "Red onion can be too strong for some in Fattoush, making green onion a preferred alternative.", "Fattoush is incomplete without fresh mint.", "The dressing can be prepared in advance and stored in a jar for convenience.", "Frying pita bread and seasoning it with za'atar adds a crucial crispy element to the salad."], "topic": "food", "topic2": "health", "genre": "recipe", "affect": [{"label": "informative", "tier": "dominant"}, {"label": "satisfying", "tier": "secondary"}, {"label": "wholesome", "tier": "minor"}], "grounding": 0, "cost": 0.01086}}, {"id": "7607885401025531149", "collection": "cooking", "caption": "New Favorite Smoothie \ud83d\ude0b\n\nFor 2 servings: \n\n3 Medjool dates, pitted\n1 small avocado\n2 cups milk of choice \n2 tbsp chia seeds\n1 tsp honey\n1 scoop vanilla \n\nTOTAL Macros for both servings: (depends on milk use)\nAbout 820 calories \n28g fiber \n37g protein ", "thumbnail": "https://p16-common-sign.tiktokcdn-eu.com/tos-useast5-p-0068-tx/o873NtBcIEvQGxeDKopEUD6BlQIdSFkfgATFaR~tplv-tiktokx-dmt-logom:tos-useast5-i-0068-tx/oAyAGBil6BBAIZwLHHAbiGUBf7JAC0ICo9EQup.image?dr=10393&x-expires=1774641600&x-signature=GuxuHdY9%2Fm4ET6670WH7ToBJxKI%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=no1a", "url": "https://www.tiktok.com/@x/video/7607885401025531149", "a": {"summary": "Ahmad Alzahabi (@thegoldenbalance) demonstrates how to make a high-protein, high-fiber green smoothie designed for long-lasting energy, specifically mentioning it as a great option for Suhoor during Ramadan. The recipe features Medjool dates for sweetness, avocado for healthy fats and creaminess, vanilla protein powder, chia seeds, and milk. Ahmad emphasizes checking dates for mold and suggests drizzling honey in the glass for extra sweetness if desired. The video concludes with a taste test and a recommendation not to be intimidated by the use of avocado in a sweet drink.", "entities": [{"name": "Ahmad Alzahabi", "type": "person", "rel": "primary"}, {"name": "Medjool dates", "type": "ingredient", "rel": "primary"}, {"name": "Avocado", "type": "ingredient", "rel": "primary"}, {"name": "Chia seeds", "type": "ingredient", "rel": "primary"}, {"name": "Vanilla protein powder", "type": "ingredient", "rel": "primary"}, {"name": "Ninja", "type": "brand", "rel": "supporting"}, {"name": "Suhoor", "type": "cultural_reference", "rel": "supporting"}, {"name": "Honey", "type": "ingredient", "rel": "supporting"}], "audio": "null", "takeaways": ["Avocado is a superior smoothie base compared to banana for those seeking more healthy fats and fiber.", "Always check Medjool dates for mold before consuming or blending them.", "This specific combination of ingredients provides high fiber (28g) and protein (37g) for sustained energy."], "topic": "food", "topic2": "health", "genre": "recipe", "affect": [{"label": "informative", "tier": "dominant"}, {"label": "satisfying", "tier": "minor"}, {"label": "funny", "tier": "minor"}], "cost": 0.00425}, "b": {"summary": "This video features @thegoldenbalance demonstrating how to make a highly nutritious and energizing smoothie, which he calls his 'new favorite smoothie' and ideal for suhoor during Ramadan. He guides viewers through adding pitted Medjool dates, avocado, chia seeds, vanilla protein powder, milk, and ice to a blender. The creator emphasizes the smoothie's health benefits, noting its high fiber and protein content, and offers honey as an optional sweetener. The video concludes with him tasting the finished smoothie and expressing his satisfaction. Total macros for two servings are approximately 820 calories, 28g fiber, and 37g protein.", "entities": [{"name": "Medjool dates", "type": "ingredient", "rel": "primary"}, {"name": "Avocado", "type": "ingredient", "rel": "primary"}, {"name": "Milk", "type": "ingredient", "rel": "primary"}, {"name": "Chia seeds", "type": "ingredient", "rel": "primary"}, {"name": "Honey", "type": "ingredient", "rel": "primary"}, {"name": "Vanilla protein powder", "type": "ingredient", "rel": "primary"}, {"name": "Ice cubes", "type": "ingredient", "rel": "supporting"}, {"name": "Smoothie", "type": "recipe", "rel": "primary"}, {"name": "Ninja Blender", "type": "product", "rel": "supporting"}, {"name": "Apple Watch", "type": "product", "rel": "background"}, {"name": "Suhoor", "type": "cultural_reference", "rel": "supporting"}, {"name": "Pitting dates", "type": "technique", "rel": "supporting"}], "audio": null, "takeaways": ["This smoothie is a highly nutritious and energizing drink, suitable for sustained energy throughout the day, especially as a suhoor meal during Ramada", "Avocado is a beneficial ingredient for smoothies, offering healthy fats and fiber, and can be a good alternative to banana.", "Always check dates for mold before consumption, as it is a common issue."], "topic": "food", "topic2": "health", "genre": "recipe", "affect": [{"label": "informative", "tier": "dominant"}, {"label": "satisfying", "tier": "secondary"}, {"label": "relaxing", "tier": "minor"}], "grounding": 0, "cost": 0.00657}}, {"id": "7607891082247998733", "collection": "cooking", "caption": "Homemade Chick-fil-a :)\n\nChick-fil-a sauce\n\n\u00bd cup mayonnaise \n3 Tbsp barbecue sauce\n2 Tbsp honey\n2 Tbsp yellow mustard\n\u00bd Tsp kosher salt \n\u00bd black pepper\n\u00bd a lemon juiced\n\nChicken Brine\n\n4 boneless skinless chicken thighs \n1 cups buttermilk\n1 cup pickle juice\n1 Tbsp paprika\n1 \u00bd Tbsp garlic powder\n1 tsp cayenne\n1 tsp white pepper\n1 tsp onion powder\n1 Tbsp kosher salt\n\nDry Drede \n\n2 cups all purpose flour\n\u00bd cup potato starch\n1 Tbsp paprika\n1 Tbsp garlic powder\n1 tsp onion powder\n1 tsp MSG (optional)\n1 Tbsp kosher salt\n2 \u00bd tsp cayenne \n1 tsp ground black pepper\n\nWaffle Fries\n\n3 large russet potatoes\n1 \u00bd Tbsp white vinegar\n1 Tbsp salt\n1.5 qt vegetable oil for frying\n\nPickles\n\n1 small english cucumber or \u00bd a large one, sliced into thin rounds \n1 Tbsp pickling spice\n1 cup white vinegar\n1 cup water\n2 Tbsp sugar\n1 tsp MSG optional \n2 Tbsp kosher salt\n2 sprigs dill\n\nAssembly \n\n4 burger buns\n4 slices pepper jack \n1 small head butter lettuce,\n1 beefsteak tomato, thinly sliced\nLemonade (for the traditional experience) \n\nFor the Chick-fil-a sauce, in a mixing bowl add, mayonnaise, barbecue sauce, honey, yellow mustard, kosher salt, black pepper and lemon. Mix until fully combined and set aside in the fridge. \n\nFor the pickles, add your sliced cucumber to your mason jar along with the dill and pickling spice. In your sauce pot add white vinegar, water, sugar, MSG and kosher salt. Bring to a simmer then pour into the mason jar. Screw the lid on, let cool then refrigerate while you prep everything else. \n\nPrep the fries. Peel your potatoes and cut on a slice once on a wavy  mandoline, quarter turn, slice again and so on and so forth to get your waffle fries. If you don't have a wavy mandoline, you can cut the potatoes normally.\n\nAdd the potatoes to a large bowl and cover with ice water. Mix well to remove the starch, drain and set aside. \n\nFill a large pot \u2154 the way with water, cover with a lid and bring to a boil. Once boiling add, white vinegar and salt.\n \nAdd your fries carefully to the pot and cook for about 2-3 minutes until slightly soft but not fully cooked. When you break one in half it should not snap like it's raw but it should be cooked with slight resistance. Make sure not to over cook this. Remove your potatoes to a couple of wire racks to cool. \n\nHeat your frying oil in a large pot to 330\u00b0F.\n\nCarefully add your fries in batches and fry for 1-2 minutes until par cooked but not golden. Remove to a wire rack and set aside while we work on our chicken.\n\nChicken Brine: To a large bowl add, buttermilk, pickle juice, kosher salt, black pepper, garlic powder, onion powder, paprika, cayenne and MSG. Add your chicken, mix well to coat and set aside in the fridge for 1 hour to overnight. Or use right away. \n\nIn a large bowl add all purpose flour, potato starch, kosher salt, black pepper, garlic powder, onion powder, paprika, cayenne and whisk to combine. Remove the chicken from the fridge. Coat the chicken in the dry dredge with no bald spots then dip back in the wet brine then back in the dry with no bald spots. Place your coated chicken on a wire rack and set aside.\n\nHeat your oil to 350\u00b0 F. Once your oil is up to temp, fry your chicken, 2 pieces at a time for about 6-8 minutes, until fully cooked and golden brown and crispy. Remove to a wire rack and repeat with all your chicken. \n\nHeat your oil to 375\u00b0F. \n\nCarefully add your par cooked fries to the oil in batches and fry for 1-2 minutes until beautiful golden brown and crispy. Remove to a wire rack and season generously with salt. \n\nAssembly, on a toasted bun add sauce, pickles, lettuce, tomato, chicken and cheese. melt however possible then add the sauced top bun. Serve with the fries and lemonade. Enjoy!\n ", "thumbnail": "https://p16-common-sign.tiktokcdn-us.com/tos-useast5-p-0068-tx/ogUW6PAZigoGSa4ZB47PagqiEBwBM1kIPUIaE~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=4KkWrinLYzk%2BN%2BP%2BWCuH%2B4BAwzc%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast5", "url": "https://www.tiktok.com/@x/video/7607891082247998733", "a": {"summary": "Creator @cooking_with.kian demonstrates a step-by-step tutorial on how to recreate a full Chick-fil-A meal at home. The video covers making brioche buns, quick-pickled cucumbers, brining and frying chicken thighs, double-frying homemade waffle fries, and mixing the iconic Chick-fil-A sauce. The final result is a high-quality, gourmet version of the fast-food classic, presented with satisfying ASMR cooking sounds.", "entities": [{"name": "Chick-fil-A", "type": "brand", "rel": "primary"}, {"name": "Chick-fil-A Sauce", "type": "recipe", "rel": "primary"}, {"name": "Chicken Brine", "type": "recipe", "rel": "supporting"}, {"name": "Waffle Fries", "type": "recipe", "rel": "supporting"}], "audio": "L'Amour Impala \u2014 L'Amour", "takeaways": ["A high-quality Chick-fil-A meal can be replicated at home by making every component from scratch, including the buns and pickles.", "Brining chicken in buttermilk and pickle juice is key to achieving the specific flavor profile of Chick-fil-A chicken."], "topic": "food", "topic2": "diy", "genre": "recipe", "affect": [{"label": "informative", "tier": "dominant"}, {"label": "satisfying", "tier": "secondary"}, {"label": "relaxing", "tier": "minor"}], "cost": 0.00412}, "b": {"summary": "This video provides a comprehensive tutorial on how to make a homemade Chick-fil-A style meal, including a fried chicken sandwich, waffle fries, and the signature sauce. The creator demonstrates each step, from preparing the brioche buns and brining the chicken to making homemade pickles, double-frying the waffle fries, and assembling the final sandwich. The main point is to guide viewers through creating a complete, delicious Chick-fil-A inspired meal from scratch.", "entities": [{"name": "Chick-fil-A", "type": "restaurant", "rel": "primary"}, {"name": "Homemade Chick-fil-A", "type": "recipe", "rel": "primary"}, {"name": "Chick-fil-A Sauce", "type": "recipe", "rel": "primary"}, {"name": "Chicken Brine", "type": "recipe", "rel": "primary"}, {"name": "Dry Dredge", "type": "recipe", "rel": "primary"}, {"name": "Mayonnaise", "type": "ingredient", "rel": "supporting"}, {"name": "Barbecue Sauce", "type": "ingredient", "rel": "supporting"}, {"name": "Honey", "type": "ingredient", "rel": "supporting"}, {"name": "Yellow Mustard", "type": "ingredient", "rel": "supporting"}, {"name": "Kosher Salt", "type": "ingredient", "rel": "supporting"}, {"name": "Black Pepper", "type": "ingredient", "rel": "supporting"}, {"name": "Lemon", "type": "ingredient", "rel": "supporting"}, {"name": "Boneless Skinless Chicken Thighs", "type": "ingredient", "rel": "primary"}, {"name": "Buttermilk", "type": "ingredient", "rel": "supporting"}, {"name": "Pickle Juice", "type": "ingredient", "rel": "supporting"}, {"name": "Paprika", "type": "ingredient", "rel": "supporting"}, {"name": "Garlic Powder", "type": "ingredient", "rel": "supporting"},     const ad=item.a.affect.filter(a=>a.tier==='dominant').map(a=>a.label).sort().join(',');
    const bd=item.b.affect.filter(a=>a.tier==='dominant').map(a=>a.label).sort().join(',');
    return ad!==bd;
  }
  return false;
}
function applyFilter(){
  const f=document.getElementById('filt').value;
  if(f==='all')filtered=I.map((_,i)=>i);
  else if(f==='diff_topic')filtered=I.map((_,i)=>i).filter(i=>isDiff(I[i],'topic'));
  else if(f==='diff_genre')filtered=I.map((_,i)=>i).filter(i=>isDiff(I[i],'genre'));
  else if(f==='diff_affect')filtered=I.map((_,i)=>i).filter(i=>isDiff(I[i],'affect'));
  else if(f==='grounded')filtered=I.map((_,i)=>i).filter(i=>I[i].b.grounding>0);
  ci=0;
  document.getElementById('filtCount').textContent=filtered.length+' items';
  renderPips();render();
}
function renderPips(){
  let h='';
  filtered.forEach((idx,fi)=>{
    const item=I[idx];
    const d=isDiff(item,'topic')||isDiff(item,'genre')||isDiff(item,'affect');
    h+=`<button class="pip${fi===ci?' active':''}${d?' diff':''}" onclick="ci=${fi};render()">${fi+1}</button>`;
  });
  document.getElementById('pips').innerHTML=h;
}
function affStr(arr){return arr.map(a=>`<span class="tag">${a.label} (${a.tier})</span>`).join(' ');}
function render(){
  if(!filtered.length){document.getElementById('content').innerHTML='<p>No items match filter.</p>';return;}
  const item=I[filtered[ci]];
  const tMatch=item.a.topic===item.b.topic;
  const gMatch=item.a.genre===item.b.genre;
  document.getElementById('prog').textContent=`${ci+1}/${filtered.length} (${item.collection})`;
  const h=`
  <div class="meta">
    ${item.thumbnail?`<img src="${item.thumbnail}" alt="thumb">`:''}
    <div style="margin-top:6px;font-size:13px">${item.caption}</div>
    <a href="${item.url}" target="_blank" style="font-size:11px;color:#A06840">Open TikTok</a>
  </div>
  <div class="grid">
    <div class="card"><h3>A: gemini-3-flash (no grounding) — $\{item.a.cost}</h3>
      <div><span class="tag ${tMatch?'match':'diff'}">topic: ${item.a.topic}</span>
      ${item.a.topic2?`<span class="tag">+${item.a.topic2}</span>`:''}
      <span class="tag ${gMatch?'match':'diff'}">genre: ${item.a.genre}</span></div>
      <div style="margin:4px 0">${affStr(item.a.affect)}</div>
      <div style="margin-top:6px"><b style="font-size:11px;color:#9C9890">SUMMARY:</b></div>
      <div class="summary">${item.a.summary}</div>
      ${item.a.takeaways.length?`<div style="margin-top:8px"><b style="font-size:11px;color:#9C9890">TAKEAWAYS:</b></div>`:''}
      ${item.a.takeaways.map(t=>`<div class="take">${t}</div>`).join('')}
      <div style="margin-top:8px"><b style="font-size:11px">Entities (${item.a.entities.length}):</b>
      ${item.a.entities.map(e=>`<div class="ent">${e.name} <span class="type">${e.type} · ${e.rel}</span></div>`).join('')}</div>
      ${item.a.audio?`<div style="margin-top:6px;font-size:12px">🎵 ${item.a.audio}</div>`:''}
    </div>
    <div class="card"><h3>B: gemini-2.5-flash (grounding) — $\{item.b.cost} ${item.b.grounding?`<span class="tag grounded">${item.b.grounding} grounding sources</span>`:''}</h3>
      <div><span class="tag ${tMatch?'match':'diff'}">topic: ${item.b.topic}</span>
      ${item.b.topic2?`<span class="tag">+${item.b.topic2}</span>`:''}
      <span class="tag ${gMatch?'match':'diff'}">genre: ${item.b.genre}</span></div>
      <div style="margin:4px 0">${affStr(item.b.affect)}</div>
      <div style="margin-top:6px"><b style="font-size:11px;color:#9C9890">SUMMARY:</b></div>
      <div class="summary">${item.b.summary}</div>
      ${item.b.takeaways.length?`<div style="margin-top:8px"><b style="font-size:11px;color:#9C9890">TAKEAWAYS:</b></div>`:''}
      ${item.b.takeaways.map(t=>`<div class="take">${t}</div>`).join('')}
      <div style="margin-top:8px"><b style="font-size:11px">Entities (${item.b.entities.length}):</b>
      ${item.b.entities.map(e=>`<div class="ent">${e.name} <span class="type">${e.type} · ${e.rel}</span></div>`).join('')}</div>
      ${item.b.audio?`<div style="margin-top:6px;font-size:12px">🎵 ${item.b.audio}</div>`:''}
    </div>
  </div>`;
  document.getElementById('content').innerHTML=h;
  renderPips();scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.key==='ArrowLeft'&&ci>0){ci--;render();}
  if(e.key==='ArrowRight'&&ci<filtered.length-1){ci++;render();}
});
applyFilter();
</script></body></html>
