<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attic Golden Set Annotator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', -apple-system, sans-serif; background: #F8F7F4; color: #1C1B18; display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar { width: 240px; background: #fff; border-right: 1px solid #E6E4DE; overflow-y: auto; flex-shrink: 0; }
.sidebar h2 { padding: 16px; font-size: 15px; font-weight: 500; border-bottom: 1px solid #E6E4DE; position: sticky; top: 0; background: #fff; z-index: 1; }
.coll-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 16px; border: none; background: none; cursor: pointer; font-size: 13px; text-align: left; border-bottom: 1px solid #F0EEE8; }
.coll-btn:hover { background: #F0EEE8; }
.coll-btn.active { background: #2C2926; color: #fff; }
.coll-btn .count { font-size: 11px; opacity: 0.6; }
.coll-btn .done { font-size: 11px; color: #4CAF50; font-weight: 500; }
.coll-btn.active .done { color: #8f8; }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Header */
.hdr { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #fff; border-bottom: 1px solid #E6E4DE; flex-shrink: 0; }
.hdr-left { display: flex; align-items: center; gap: 16px; }
.prog { font-size: 13px; color: #9C9890; }
.hdr-actions { display: flex; gap: 8px; }
.btn { padding: 6px 14px; border: 1px solid #E6E4DE; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
.btn:hover { background: #F0EEE8; }
.btn-primary { background: #2C2926; color: #fff; border-color: #2C2926; }
.btn-primary:hover { background: #1C1B18; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* Content */
.content { flex: 1; overflow-y: auto; padding: 20px; }
.item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; }

/* Left: metadata */
.meta-col { display: flex; flex-direction: column; gap: 12px; }
.card { background: #fff; border: 1px solid #E6E4DE; border-radius: 8px; padding: 16px; }
.card h3 { font-size: 13px; color: #9C9890; margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.thumb { width: 100%; max-height: 300px; object-fit: contain; border-radius: 6px; background: #000; }
.caption { font-size: 14px; line-height: 1.5; margin: 8px 0; }
.meta-line { font-size: 12px; color: #9C9890; margin: 3px 0; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #F0EEE8; margin: 2px; }
.tag.hard { background: #f8d7da; color: #721c24; }
.tag.medium { background: #fff3cd; color: #856404; }
.tag.easy { background: #d4edda; color: #155724; }
.tiktok-link { display: inline-block; margin-top: 8px; padding: 6px 12px; background: #000; color: #fff; border-radius: 6px; font-size: 12px; text-decoration: none; }
.tiktok-link:hover { background: #333; }

/* Right: annotation */
.anno-col { display: flex; flex-direction: column; gap: 12px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: #2C2926; }
.field .hint { font-size: 11px; color: #9C9890; margin-bottom: 4px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 8px 10px; border: 1px solid #E6E4DE; border-radius: 6px;
  font-size: 13px; font-family: inherit; background: #fff;
}
.field textarea { min-height: 60px; resize: vertical; }
.field select { height: 34px; }
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: #2C2926;
}
.auto-hint { font-size: 11px; color: #A06840; font-style: italic; }
.annotated-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.annotated-indicator.done { background: #4CAF50; }
.annotated-indicator.empty { background: #E6E4DE; }

/* Item nav within collection */
.item-nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
.item-pip { width: 28px; height: 28px; border: 1px solid #E6E4DE; border-radius: 6px; background: #fff;
  cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.item-pip:hover { background: #F0EEE8; }
.item-pip.active { background: #2C2926; color: #fff; border-color: #2C2926; }
.item-pip.annotated { border-color: #4CAF50; }
.item-pip.active.annotated { background: #2E7D32; border-color: #2E7D32; }

/* Deep annotation section */
.deep-section { border-top: 2px solid #f8d7da; padding-top: 12px; margin-top: 4px; }
.deep-section h3 { color: #721c24; }

/* Keyboard hints */
.kbd { display: inline-block; padding: 1px 5px; border: 1px solid #E6E4DE; border-radius: 3px; font-size: 11px; font-family: monospace; background: #F0EEE8; }

/* Filter bar */
.filter-bar { display: flex; gap: 8px; align-items: center; }
.filter-bar label { font-size: 12px; color: #9C9890; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main">
  <div class="hdr">
    <div class="hdr-left">
      <b>Golden Set Annotator</b>
      <span class="prog" id="prog"></span>
      <span style="font-size:11px;color:#9C9890">
        <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> navigate
        &nbsp;<span class="kbd">Cmd+S</span> export
      </span>
    </div>
    <div class="hdr-actions">
      <button class="btn" onclick="importAnnotations()">Import</button>
      <button class="btn btn-primary" onclick="exportAnnotations()">Export JSON</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<input type="file" id="importFile" style="display:none" accept=".json" onchange="handleImport(event)">

l}, "human_deep": null}, {"id": "7605344899503770911", "url": "https://www.tiktok.com/@tommyjoochoi/video/7605344899503770911", "creator": "tommyjoochoi", "collection": "Food", "apify": {"caption": "Chicago Italian beef discourse has gotten weird.\nEver since The Bear, we\u2019ve turned a working-class sandwich into a hype contest.\n\nBut the Italian beef was never about clout.\nIt was born from Italian immigrants stretching tough cuts of meat, slow-roasting them, slicing them thin, dunking them in gravy, and feeding whole communities. Standing up. Dripping everywhere. No frills.\n\nThat\u2019s why neighborhood spots still matter.\n\nJohnny\u2019s Beef & Gyros is exactly that.\nA family-run Chicago staple doing it right.\n\nOrder it dipped, with hot giardiniera and mozzarella.\nRazor-thin beef soaked in rich au jus. Soft, gravy-logged bread that still holds together. Crunchy, spicy giardiniera cutting through the fat. Gooey mozzarella melting everything into one chaotic, perfect bite.\n\nDon\u2019t skip the Greek fries.\nFried in beef tallow, tossed with olive oil, oregano, feta, and lemon. Crispy, savory, salty, and bright. A Mediterranean twist that somehow still feels deeply Chicago.\n\nAnd yes, get the pizza puff. Always.\n\nYou don\u2019t need to sit in traffic for 45 minutes to eat a great Italian beef.\nSometimes the best one is a few blocks away, made by people who actually feed the neighborhood.\n\nSupport the spots that built this city.\nStop confusing hype with heritage.\n\nSave this for your next beef run.\nShare it with someone who thinks only the \u201cbig names\u201d matter.\n\n\ud83d\udccd 2300 N Lincoln Ave, Chicago, IL 60614 \n\n#ChicagoFood #ItalianBeef #ChicagoEats #SupportLocalChicago #GreasySpoonChicago", "hashtags": ["chicagofood", "italianbeef", "chicagoeats", "supportlocalchicago", "greasyspoonchicago"], "music_metadata": "BAD BUNNY INSTRUMENTAL", "duration_seconds": 168, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast8-p-0068-tx2/osU6npACfACoAVD8EPELzNIAgFRx5ikAeVEEEp~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=4p9QX58KJs3DJed0BOEhm2yrrkE%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast5"}, "human": {"description": "", "search_queries": [], "topic": "food", "affect": "", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "Food", "auto_topic": "food", "auto_genre": null}, "human_deep": null}, {"id": "7606834394950651167", "url": "https://www.tiktok.com/@tommyjoochoi/video/7606834394950651167", "creator": "tommyjoochoi", "collection": "Food", "apify": {"caption": "Breakfast usually isn\u2019t worth leaving the house for.\n\nBut Batter & Berries in Lincoln Park is different.\n\nThis Black-owned, independently owned Chicago brunch staple has been redefining breakfast since 2012. If you know, you know: the famous French toast flight is the move. Strawberry. Blueberry. Lemon. Caramel. Thick-cut brioche soaked in rich custard, pan-fried golden, topped with fresh fruit, candied walnuts, and dulce de leche.\n\nAnd the Cluck-N-Gaufre? A sweet potato waffle stuffed with fried chicken, topped with a buttermilk herb-fried chicken breast and nutmeg hot sauce. Sweet. Savory. Crispy. Spicy. It hits every note.\n\nDon\u2019t skip the cheese-crusted hashbrowns. Golden, lacy, shatteringly crisp on the outside, fluffy inside. The only correct breakfast potato.\n\nBeyond the food, Batter & Berries is part of what makes Chicago\u2019s food scene special. A Black-owned restaurant thriving in the heart of Lincoln Park, bringing creativity, culture, and serious flavor to one of the city\u2019s most competitive brunch neighborhoods.\n\nYes, there\u2019s usually a wait. Yes, it\u2019s worth it.\n\nSave this for your next Chicago brunch.\nSend it to your group chat.\nAnd go hungry.\n\n\ud83d\udccd 2748 N. Linco , right here in Chicago.\n\nSave this for your next comfort food craving.\n\nTag your pourer or dipper friend.\n\nAnd go taste a piece of culinary history that\u2019s been hiding in plain sight.\n\n\ud83d\udccd Peking Mandarin Restaurant \u2014 3459 W Lawrence Ave, Chicago\n\n\ud83d\udcb0 Affordable, generous portions\n\ud83c\udf5c Korean-Chinese comfort food classics\n\u2764\ufe0f A true local favorite\n\n#chicagofood #chicagofoodie #chicagoeats #koreanchinesefood #jjajangmyeon               ", "hashtags": ["chicagofood", "chicagofoodie", "chicagoeats", "koreanchinesefood", "jjajangmyeon"], "music_metadata": "Summer and Brunch", "duration_seconds": 109, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast8-p-0068-tx2/oIKlp9ACEi4ysIAird0CtBMBdIdhKqAfAAWiDI~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=pq8XXaXkbEyVNJjxMbn5V2rsmxI%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast8"}, "human": {"description": "", "search_queries": [], "topic": "food", "affect": "", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "Food", "auto_topic": "food", "auto_genre": null}, "human_deep": null}, {"id": "7594621221497539895", "url": "https://www.tiktok.com/@ha.been.ballin/video/7594621221497539895", "creator": "ha.been.ballin", "collection": "Food", "apify": {"caption": "The wrap that changed my life #chicago #chickencaesarwrap ", "hashtags": ["chicago", "chickencaesarwrap"], "music_metadata": "Kortezeats", "duration_seconds": 9, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast5-p-0068-tx/o8ighzwiz9WJDTaBIUd4gVPX2lIBDWgliLEmA~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=SpoU7VXl24Z1ppKVhyqqDEvaiYw%3D&t=4d5b0474&ps=13740610&shp=81f88b70&sh _extraction"], "collection_source": "Food", "auto_topic": "food", "auto_genre": null}, "human_deep": null}, {"id": "7371866866043751726", "url": "https://www.tiktok.com/@breadbakebeyond/video/7371866866043751726", "creator": "breadbakebeyond", "collection": "Food", "apify": {"caption": "Pesto Rigatoni with Cherry Tomatoes\n\nFresh pesto is something I truly enjoy using in my recipes, as you can tell! Together with cherry tomatoes, they create a great combo that can be used in many ways. This recipe is a fun and quick dinner idea that can be easily paired with your favorite protein. It's bursting with flavor and makes you feel like you're on a quick trip to Italy!\n\nIngredients:\n\n\u2022\u2060  \u20601/2 pound pasta (I used rigatoni)\n\u2022\u2060  \u20603/4 cup grated Parmesan cheese (reserve some for serving)\n\u2022\u2060  \u20602 tablespoons fresh pesto (recipe below)\n\u2022\u2060  \u20604 garlic cloves, minced or finely chopped\n\u2022\u2060  \u20601/4 cup white wine\n\u2022\u2060  \u20601 teaspoon chili flakes (reduce if preferred less spicy)\n\u2022\u2060  \u20602 teaspoons black pepper\n\u2022\u2060  \u2060Kosher salt, to taste\n\u2022\u2060  \u20604 tablespoons olive oil or unsalted butter\n\u2022\u2060  \u20601 1/2 cups cherry tomatoes, halved\n\nFresh Pesto:\n\n\u2022\u2060  \u20602 cups fresh basil leaves\n\u2022\u2060  \u20601-2 tablespoons pine nuts, toasted\n\u2022\u2060  \u20601/2 cup grated Parmesan cheese\n\u2022\u2060  \u20602-3 garlic cloves\n\u2022\u2060  \u20601/4 teaspoon salt\n\u2022\u2060  \u20603 tablespoons olive oil\n\u2022\u2060  \u20602 tablespoons water (if needed)\n\nFor Serving:\n\n\u2022\u2060  \u2060Additional chili flakes, to taste\n\u2022\u2060  \u2060Freshly ground black pepper (optional)\n\u2022\u2060  \u2060Parmesan cheese for garnish\n\n#pastalover #mediterraneanfood #homecooking #foodietiktok #summerrecipes #cookingtiktok #easyrecipe \n\nSummer Pasta Dish\nPesto Rigatoni Recipe\nCherry Tomato Pasta\nEasy Homemade Pesto\nEa video/7347857054394010923", "creator": "stealth_health_life", "collection": "Food", "apify": {"caption": "The Slow Cooker Meal Prep Series has hit over 125 MILLION views across platforms \ud83e\udd2f\n\nThe bulk approach to meal prepping has been a game changer for me (there's no better feeling than having a freezer stocked with 60-70+ high protein meals, ready to go whenever) - so it's awesome to see so many of y'all feel the same \ud83d\ude4f\n\nThe slow cooker is the ultimate tool for making bulk meal prep as simple as possible\n\nMy content has been focused on meal prep for quite a while now - and there's a few things l've learned since making meal prepping my full time job \ud83d\udc47\n\n1.) Freezing meal preps is essential. From a pure taste perspective - meal preps stored frozen retain flavor and freshness FAR BETTER than anything stored in the fridge. I've found that food stored for a month frozen tastes better than food stored in the fridge for just 24 hours. Equally as important - if you store meal preps frozen, there isn't \"pressure\" to finish them within 5-7 days to avoid them going bad. Aka - your meal preps aren't a ticking time bomb. Freezing meal preps allows you to build a massive stockpile of meals in your freezer that are available whenever you want them\n\n2.) This ties into the first point - but meal prep in BULK. Find a recipe you like, and scale it to make 10+ servings (I know some people take my recipes and scale them up to 20 serving meals). Again, freezing is essential here so that you can store meals for the long term + don't have to eat the same thing 10 straight days\n\n3.) Lastly, and by far the most important if you want to succeed with meal prep: the meals have to taste amazing and be something you genuinely look forward to eating. You want your meal preps to sound better than anything you could get at the food court. I have tons of free recipes on my feed for you to try out, and an entire meal prep cookbook with 100+ high protein recipes built to make the process as enjoyable as possible (and yes, an entirely slow cooker focused cookbook is coming later this year)\n\nLet me know what recipes you want to see next as part of this series!\n\n#stealthhealth #mealprep #highproteinrecipes #macrofriendlyrecipes #mealpreprecipes #slowcookerrecipes ", "hashtags": ["stealthhealth", "mealprep", "highproteinrecipes", "macrofriendlyrecipes", "mealpreprecipes", "slowcookerrecipes"], "music_metadata": "original sound", "duration_seconds": 38, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast5-p-0068-tx/0a5170fac0e545a98fa25955310f76ce_1710806322~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=gtM2qDmapJnv9%2BNd1zJU2DtABB8%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast8"}, "human": {"description": "", "search_queries": [], "topic": "food", "affect": "", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "Food", "auto_topic": "food", "auto_genre": null}, "human_deep": null}, {"id": "7616120931760508190", "url": "https://www.tiktok.com/@kevthomusic/video/7616120931760508190", "creator": "kevthomusic", "collection": "music", "apify": {"caption": "Didn\u2019t realize Dil Chahta Hai had that dream pop sauce, anyone else love these two songs? So beautifully melancholic.\n\nPSA I\u2019m not doing anything on the board, the mix with this video got scrapped for my original chops \ud83d\ude02 last thing I wanna be is a fake DJ\n\n#dilchahtahai #theradiodept #bollywood #dreampop #dj", "hashtags": ["dilchahtahai", "theradiodept", "bollywood", "dreampop", "dj"], "music_metadata": "original sound", "duration_seconds": 160, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast8-p-0068-tx2/oAmngq8VlGAulc ce down. Cook for 3-4 minutes until egg is cooked. \n\u25aa\ufe0fFlip over and add your toppings of choice \n\u25aa\ufe0fFold over and enjoy. \n\n#bagel #healthyrecipes #easyrecipes #recipe ", "hashtags": ["bagel", "healthyrecipes", "easyrecipes", "recipe"], "music_metadata": "Echoes", "duration_seconds": 13, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-no1a-p-0037-no/ocIAJiCsFMNfN3tzN01aAhytlFICIhdABqRMiw~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=RS6gH%2Fmuhmg%2B2cmEce7omrwlwRw%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast5"}, "human": {"description": "", "search_queries": [], "topic": "food", "affect": "informative", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "cooking", "auto_topic": "food", "auto_genre": "recipe"}, "human_deep": null}, {"id": "7597122154760572173", "url": "https://www.tiktok.com/@cooking_with.kian/video/7597122154760572173", "creator": "cooking_with.kian", "collection": "cooking", "apify": {"caption": "Poutine! \ud83c\udde8\ud83c\udde6\n\nFries\n\n3 large russet potatoes, washed and cut into \u2153 inch strips\n1 Tbsp white vinegar\n2 tsp salt\n2 tsp baking soda\n3 qt frying oil\nKosher salt\n\nGravy \n\n3 \u00bd  cups good beef stock (homemade preferably) \n1 small bunch fresh thyme\n3 sprigs fresh rosemary \n\u00bc cup dried shiitake mushrooms\n4 Tbsp unsalted butter\n3 cloves garlic, minced\n1 large shallot, finely diced\n3 Tbsp all purpose flour\n1 Tbsp worcestershire sauce\n1 Tbsp dark soy sauce\n\nAssembly\n\n16 oz cheese curds\nParsley leaves\n\nFries, to start, fill a large bowl with cold water. \n\nWash and cut your potatoes into \u2153 inch strips and add them to the water. Mix well to remove some of the starch then drain off the water. \n\nFill a large pot \u2154 of the way with water and bring to a boil. Once boiling add, white vinegar, baking soda and salt. \n\nBlanching: Add your fries carefully to the pot and cook for about 2 minutes until slightly soft but not fully cooked. When you break one in half it should not snap like it's raw but it should be cooked with slight resistance. Make sure not to over cook this. Remove your fries to a couple of wire racks to cool. \n\nFirst fry: Heat your frying oil in a large pot to 330\u00b0F.\n\nCarefully add your fries in batches and fry for 1-2 minutes until par cooked but not golden. Remove to a wire rack and set aside while we make our gravy.\n\nInfused stock: Add your beef stock to a medium pot along with fresh thyme, rosemary and shiitakes. Set over medium, bring to a simmer then pour into a heat proof container to infuse for 15-20 minutes then remove the aromatics.\n\nGravy: Clean your pot then set over medium-low. Add the butter, once melted add the shallot and garlic. Season with salt and cook for 2-3 minutes until softened. Add the flour. Cook for 1-2 minutes and while whisking, gradually add your stock. Once thickened, finally add worcestershire sauce and soy sauce. Season to taste with salt & pepper. Keep warm. \n\nHeat your oil to 375\u00b0F. \n\nSecond fry: Carefully add your par cooked fries to the oil in batches and fry for 1-2 minutes until beautiful golden brown and crispy. Remove to a wire rack and season generously with salt. \n\nAssembly:To assemble on a plate, fries, cheese curds, gravy then more fries, cheese curds and generous gravy. Garnish with parsley. Enjoy! ", "hashtags": null, "music_metadata": "original sound", "duration_seconds": 53, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast5-p-0068-tx/ogEauWZAivli5YBIA8v3gEBBm4anAdj19n4Ak~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=fdJSMKoDq4zbUNFUmiRkXof63WA%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast8"}, "human": {"description": "", "search_queries": [], "topic": "food", "affect": "informative", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "cooking", "auto_topic": "food", "auto_genre": "recipe"}, "human_deep": null}, {"id": "7598991175273532685", "url": "https://www.tiktok.com/@cooking_with.kian/video/7598991175273532685", "creator": "cooking_with.kian", "collection": "cooking", "apify": {"caption": "Honey Sriracha Chicken Sandwich!\n\nRecipe on my YouTube!", "hashtags": null, "music_metadata": "original sound", "duration_seconds": 60, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast5-p-0068-tx/oEIXcikCc1javgcBdIiiB6PjCKiCAlO4U8UEI~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=9%2FB%2BF9tuLKCXppTfdw2fcuwdIBA%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast8"}, "human": {"description": "", "search_queries": [], "topic": "food", "affect": "informative", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "cooking", "auto_topic": "food", "auto_genre": "recipe"}, "human_deep": null}, {"id": "7607891082247998733", "url": "https://www.tiktok.com/@cooking_with.kian/video/7607891082247998733", "creator": "cooking_with.kian", "collection": "cooking", "apify": {"caption": "Homemade Chick-fil-a :)\n\nChick-fil-a sauce\n\n\u00bd cup mayonnaise \n3 Tbsp barbecue sauce\n2 Tbsp honey\n2 Tbsp yellow mustard\n\u00bd Tsp kosher salt \n\u00bd black pepper\n\u00bd a lemon juiced\n\nChicken Brine\n\n4 boneless skinless chicken thighs \n1 cups buttermilk\n1 cup pickle juice\n1 Tbsp paprika\n1 \u00bd Tbsp garlic powder\n1 tsp cayenne\n1 tsp white pepper\n1 tsp onion powder\n1 Tbsp kosher salt\n\nDry Drede \n\n2 cups all purpose flour\n\u00bd cup potato starch\n1 Tbsp paprika\n1 Tbsp garlic powder\n1 tsp onion powder\n1 tsp MSG (optional)\n1 Tbsp kosher salt\n2 \u00bd tsp cayenne \n1 tsp ground black pepper\n\nWaffle Fries\n\n3 large russet potatoes\n1 \u00bd Tbsp white vinegar\n1 Tbsp salt\n1.5 qt vegetable oil for frying\n\nPickles\n\n1 small english cucumber or \u00bd a large one, sliced into thin rounds \n1 Tbsp pickling spice\n1 cup white vinegar\n1 cup water\n2 Tbsp sugar\n1 tsp MSG optional \n2 Tbsp kosher salt\n2 sprigs dill\n\nAssembly \n\n4 burger buns\n4 slices pepper jack \n1 small head butter lettuce,\n1 beefsteak tomato, thinly sliced\nLemonade (for the traditional experience) \n\nFor the Chick-fil-a sauce, in a mixing bowl add, mayonnaise, barbecue sauce, honey, yellow mustard, kosher salt, black pepper and lemon. Mix until fully combined and set aside in the fridge. \n\nFor the pickles, add your sliced cucumber to your mason jar along with the dill and pickling spice. In your sauce pot add white vinegar, water, sugar, MSG and kosher salt. Bring to a simmer then pour into the mason jar. Screw the lid on, let cool then refrigerate while you prep everything else. \n\nPrep the fries. Peel your potatoes and cut on a slice once on a wavy  mandoline, quarter turn, slice again and so on and so forth to get your waffle fries. If you don't have a wavy mandoline, you can cut the potatoes normally.\n\nAdd the potatoes to a large bowl and cover with ice water. Mix well to remove the starch, drain and set aside. \n\nFill a large pot \u2154 the way with water, cover with a lid and bring to a boil. Once boiling add, white vinegar and salt.\n \nAdd your fries carefully to the pot and cook for about 2-3 minutes until slightly soft but not fully cooked. When you break one in half it should not snap like it's raw but it should be cooked with slight resistance. Make sure not to over cook this. Remove your potatoes to a couple of wire racks to cool. \n\nHeat your frying oil in a large pot to 330\u00b0F.\n\nCarefully add your fries in batches and fry for 1-2 minutes until par cooked but not golden. Remove to a wire rack and set aside while we work on our chicken.\n\nChicken Brine: To a large bowl add, buttermilk, pickle juice, kosher salt, black pepper, garlic powder, onion powder, paprika, cayenne and MSG. Add your chicken, mix well to coat and set aside in the fridge for 1 hour to overnight. Or use right away. \n\nIn a large bowl add all purpose flour, potato starch, kosher salt, black pepper, garlic powder, onion powder, paprika, cayenne and whisk to combine. Remove the chicken from the fridge. Coat the chicken in the dry dredge with no bald spots then dip back in the wet brine then back in the dry with no bald spots. Place your coated chicken on a wire rack and set aside.\n\nHeat your oil to 350\u00b0 F. Once your oil is up to temp, fry your chicken, 2 pieces at a time for about 6-8 minutes, until fully cooked and golden brown and crispy. Remove to a wire rack and repeat with all your chicken. \n\nHeat your oil to 375\u00b0F. \n\nCarefully add your par cooked fries to the oil in batches and fry for 1-2 minutes until beautiful golden brown and crispy. Remove to a wire rack and season generously with salt. \n\nAssembly, on a toasted bun add sauce, pickles, lettuce, tomato, chicken and cheese. melt however possible then add the sauced top bun. Serve with the fries and lemonade. Enjoy!\n ", "hashtags": null, "music_metadata": "original sound", "duration_seconds": 59, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast5-p-0068-tx/ogUW6PAZigoGSa4ZB47PagqiEBwBM1kIPUIaE~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=4KkWrinLYzk%2BN%2BP%2BWCuH%2B4BAwzc%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast5"}, "human": {"description": "", "search_queries": [], "topic": "food", "affect": "informative", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extracti : [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "Workout", "auto_topic": "fitness", "auto_genre": "workout"}, "human_deep": null}, {"id": "7602724902357060882", "url": "https://www.tiktok.com/@j.movement.rs/video/7602724902357060882", "creator": "j.movement.rs", "collection": "Workout", "apify": {"caption": "Part 3 of my scapular winging rehab journey. Got a lot of good suggestions in part 2, including using diaphragmatic breathing during the exercises, foam roller extensions on the wall, and prone T raises/Y raises. More to come in part 4\u270c\ufe0f\n\n#scapularwinging #scapularmobility #mobility #mobilitytraining #rehab ", "hashtags": ["scapularwinging", "scapularmobility", "mobility", "mobilitytraining", "rehab"], "music_metadata": "original sound", "duration_seconds": 176, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-alisg-p-0037/oYCAcgBtiA2FwTCgAIXMABkCx93EIKAfw0Siii~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=TZ3vw3gxjc%2BLol645c0YTms82E4%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast8"}, "human": {"description": "", "search_queries": [], "topic": "fitness", "affect": "informative", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "Workout", "auto_topic": "fitness", "auto_genre": "workout"}, "human_deep": null}, {"id": "7603057693699394830", "url": "https://www.tiktok.com/@madscientistofmuscle/video/7603057693699394830", "creator": "madscientistofmuscle", "collection": "Workout", "apify": {"caption": "Split Stance Dumbbell Curls - now first off, how I do curls (with elbow coming up, which does inclue a bit of front delt action) might be different than how you've learned it. That's NOT the key point of this video!\n\nI find this raise of the elbow is good for getting a bit more bicep activation at the top, due to where the bicep originates in the shoulder. You can do them however you like!\n\nThe key point here is the split stance for dumbbell (or barbell) curls.\n\nWhen you do any sort of curl with your feet in line horizontally, you create a thinner base of support.\n\nWhen the weight comes up to the midpoint, this puts the load out in front of your base of support, which means your body has to compensate by leaning back.  When then creates more incentive to cheat and heave.\n\nThis is actually more of an issue on barbell curls but it does happen with dumbbell curls as well.\n\nEssentially, all you need to do to fix this is set your feet in a split stance.\n\nThis creates a larger base of support so that you can keep your upper body still while you do whatever curl variation you're doing.\n\nIt's a simple setup tweak that can have an immediately impact.\n\n#madscientistofmuscle #curls #dumbbellcurl #bicepcurls #dumbbellcurls #barbellcurl #bicepexercise #biceptraining #bicepworkout #biggerarms #bicepcurls", "hashtags": null, "music_metadata": "original sound - Nick Nilsson", "duration_seconds": 90, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast5-p-0068-tx/oIY3CAGEVSLfQxEUfgA3PQAgIAspu0DapTFDFC~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=DaWXydzKDW2NWQK%2FNPHxuVvb90w%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast8"}, "human": {"description": "", "search_queries": [], "topic": "fitness", "affect": "informative", "key_entities": [], "save_reason": "", "difficulty": "easy", "failure_modes": ["entity_extraction"], "collection_source": "Workout", "auto_topic": "fitness", "auto_genre": "workout"}, "human_deep": null}, {"id": "7254210912930843947", "url": "https://www.tiktok.com/@looklikeyoulift/video/7254210912930843947", "creator": "looklikeyoulift", "collection": "Workout", "apify": {"caption": "R : [], "topic": "travel", "affect": "", "key_entities": [], "save_reason": "", "difficulty": "medium", "failure_modes": ["entity_heavy"], "collection_source": "Europe", "auto_topic": "travel", "auto_genre": null}, "human_deep": null}, {"id": "7271024356304637226", "url": "https://www.tiktok.com/@milesjones/video/7271024356304637226", "creator": "milesjones", "collection": "Europe", "apify": {"caption": "Day 7/30 of Euro Summer: Guide to 24 hours in Amsterdam \ud83c\uddf3\ud83c\uddf1 #amsterdamguide #amsterdamtips #amsterdamfood ", "hashtags": ["amsterdamguide", "amsterdamtips", "amsterdamfood"], "music_metadata": "Wes Anderson-esque Cute Acoustic", "duration_seconds": 71, "is_slideshow": false, "image_count": null, "subtitle_text": null, "comments_top10": null, "thumbnail_url": "https://p16-common-sign.tiktokcdn-us.com/tos-useast5-p-0068-tx/o8f5i77k5AymDEZChHje7R3BS0ntIKy7E9QgEz~tplv-tiktokx-origin.image?dr=9636&x-expires=1774641600&x-signature=JiK5ngJjIaQKiDBDih8V3cRPXfk%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast5"}, "human": {"description": "", "search_queries": [], "topic": "travel", "affect": "", "key_entities": [], "save_reason": "", "difficulty": "medium", "failure_modes": ["entity_heavy"], "collection_source": "Europe", "auto_topic": "travel", "auto_genre": null}, "human_deep": null}];
const TOPICS = ["", "food", "fashion", "beauty", "fitness", "travel", "music", "dance", "comedy", "education", "technology", "gaming", "sports", "pets", "art", "books", "movies_tv", "news", "politics", "science", "nature", "diy", "finance", "relationships", "parenting", "health", "career", "real_estate", "automotive", "other"];
const AFFECTS = ["", "funny", "wholesome", "sad", "angry", "nostalgic", "inspiring", "informative", "cringe", "satisfying", "scary", "relaxing", "shocking", "neutral"];
const GENRES = ["", "tutorial", "review", "vlog", "skit", "storytime", "haul", "asmr", "challenge", "reaction", "compilation", "before_after", "day_in_life", "get_ready_with_me", "unboxing", "recipe", "workout", "news_commentary", "interview", "timelapse", "meme", "duet", "edit", "pov", "room_tour", "outfit_showcase", "ranking", "other"];

// Group items by collection
const COLLECTIONS = {};
ITEMS.forEach((item, idx) => {
  const c = item.collection;
  if (!COLLECTIONS[c]) COLLECTIONS[c] = [];
  COLLECTIONS[c].push({ ...item, _idx: idx });
});
const COLL_NAMES = Object.keys(COLLECTIONS);

// State
let currentColl = COLL_NAMES[0];
let currentItemIdx = 0;
let annotations = JSON.parse(localStorage.getItem('gs_annotations') || '{}');

function save() {
  localStorage.setItem('gs_annotations', JSON.stringify(annotations));
}

function getAnno(id) {
  if (!annotations[id]) annotations[id] = {};
  return annotations[id];
}

function isAnnotated(id) {
  const a = annotations[id];
  return a && (a.description || a.search_queries || a.save_reason);
}

function countAnnotated(collName) {
  return COLLECTIONS[collName].filter(i => isAnnotated(i.id)).length;
}

function totalAnnotated() {
  return ITEMS.filter(i => isAnnotated(i.id)).length;
}

// Render sidebar
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let h = '<h2>Collections</h2>';
  COLL_NAMES.forEach(name => {
    const items = COLLECTIONS[name];
    const done = countAnnotated(name);
    const active = name === currentColl ? ' active' : '';
    h += `<button class="coll-btn${active}" onclick="selectColl('${name.replace(/'/g, "\\'")}')">
      <span>${name}</span>
      <span>${done ? `<span class="done">${done}/</span>` : ''}<span class="count">${items.length}</span></span>
    </button>`;
  });
  sb.innerHTML = h;
}

function selectColl(name) {
  currentColl = name;
  currentItemIdx = 0;
  renderSidebar();
  renderContent();
}

function selectItem(idx) {
  currentItemIdx = idx;
  renderContent();
}

function renderContent() {
  const items = COLLECTIONS[currentColl];
  const item = items[currentItemIdx];
  const anno = getAnno(item.id);
  const apify = item.apify || {};

  // Item pips
  let pips = '<div class="item-nav">';
  items.forEach((it, idx) => {
    const active = idx === currentItemIdx ? ' active' : '';
    const ann = isAnnotated(it.id) ? ' annotated' : '';
    pips += `<button class="item-pip${active}${ann}" onclick="selectItem(${idx})" title="${it.creator}">${idx + 1}</button>`;
  });
  pips += '</div>';

  // Thumbnail
  const thumbUrl = apify.thumbnail_url;
  const thumbHtml = thumbUrl
    ? `<img class="thumb" src="${thumbUrl}" alt="thumbnail" loading="lazy" onerror="this.style.display='none'">`
    : '<div style="height:100px;background:#F0EEE8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9C9890;font-size:12px">No thumbnail</div>';

  // Tags
  const diffClass = item.human.difficulty;
  const hashtags = (apify.hashtags || []).map(h => '#' + h).join(' ');
  const duration = apify.duration_seconds ? apify.duration_seconds + 's' : '?';
  const isSlideshow = apify.is_slideshow ? 'slideshow' : 'video';

  // Pre-fill hints
  const autoTopic = item.human.auto_topic;
  const autoGenre = item.human.auto_genre;
  const topicHint = autoTopic ? `Auto-filled: ${autoTopic} (verify or override)` : 'Needs manual — no auto-fill';
  const genreHint = autoGenre ? `Auto-filled: ${autoGenre} (verify or override)` : 'Optional — fill if obvious';
  const affectHint = item.human.affect ? `Hint: ${item.human.affect} (verify or override)` : 'Needs manual — no auto-fill';

  // Deep section
  let deepHtml = '';
  if (item.human_deep !== null) {
    deepHtml = `
    <div class="card">
      <div class="deep-section">
        <h3>Deep Annotation (hard item)</h3>
        <div class="field">
          <label>Entities (detailed — name, type, relevance)</label>
          <div class="hint">List every identifiable entity: people, places, products, songs, brands, techniques, recipes, etc.</div>
          <textarea rows="4" data-field="deep_entities" oninput="updateField(this)">${anno.deep_entities || ''}</textarea>
        </div>
        <div class="field">
          <label>Per-slide content (if slideshow)</label>
          <textarea rows="3" data-field="deep_per_slide" oninput="updateField(this)">${anno.deep_per_slide || ''}</textarea>
        </div>
        <div class="field">
          <label>Actual audio (song/sound playing)</label>
          <textarea rows="2" data-field="deep_actual_audio" oninput="updateField(this)">${anno.deep_actual_audio || ''}</textarea>
        </div>
        <div class="field">
          <label>Cultural context (memes, trends, references)</label>
          <textarea rows="2" data-field="deep_cultural_context" oninput="updateField(this)">${anno.deep_cultural_context || ''}</textarea>
        </div>
        <div class="field">
          <label>Structured content type (recipe / list / tutorial steps / ranking)</label>
          <input type="text" data-field="deep_structured_type" oninput="updateField(this)" value="${escAttr(anno.deep_structured_type || '')}">
        </div>
        <div class="field">
          <label>Structured items (each item in the list/recipe/steps)</label>
          <textarea rows="3" data-field="deep_structured_items" oninput="updateField(this)">${anno.deep_structured_items || ''}</textarea>
        </div>
      </div>
    </div>`;
  }

  const html = `
  ${pips}
  <div class="item-grid">
    <div class="meta-col">
      <div class="card">
        <h3>Item ${currentItemIdx + 1}/${items.length} — ${currentColl}</h3>
        ${thumbHtml}
        <div style="margin-top:8px">
          <span class="tag ${diffClass}">${diffClass}</span>
          <span class="tag">${isSlideshow}</span>
          <span class="tag">${duration}</span>
        </div>
        <a class="tiktok-link" href="${item.url}" target="_blank" rel="noopener">Open on TikTok &rarr;</a>
      </div>

      <div class="card">
        <h3>Apify Metadata</h3>
        <div class="caption">${escHtml(apify.caption || '(no caption)')}</div>
        <div class="meta-line"><b>Creator:</b> @${item.creator}</div>
        <div class="meta-line"><b>Hashtags:</b> ${hashtags || '(none)'}</div>
        <div class="meta-line"><b>Music:</b> ${escHtml(apify.music_metadata || '(unknown)')}</div>
        ${apify.comments_top10 && apify.comments_top10.length ? `
        <div style="margin-top:8px">
          <b style="font-size:12px">Top Comments:</b>
          ${apify.comments_top10.slice(0, 5).map(c => `<div class="meta-line" style="font-style:italic">"${escHtml(c.substring(0, 120))}"</div>`).join('')}
        </div>` : ''}
      </div>

      <div class="card">
        <h3>Failure Modes</h3>
        <div>${(item.human.failure_modes || []).map(f => `<span class="tag">${f}</span>`).join('')}</div>
      </div>
    </div>

    <div class="anno-col">
      <div class="card">
        <h3>Your Annotation</h3>

        <div class="field">
          <label>Description *</label>
          <div class="hint">2-3 sentences: what is this TikTok actually about? What's the point?</div>
          <textarea rows="3" data-field="description" oninput="updateField(this)">${anno.description || ''}</textarea>
        </div>

        <div class="field">
          <label>Search queries *</label>
          <div class="hint">1-3 queries you'd type to find this 6 months from now (comma-separated)</div>
          <input type="text" data-field="search_queries" oninput="updateField(this)"
            value="${escAttr(anno.search_queries || '')}" placeholder="e.g. grilled cheese recipe, that sandwich video">
        </div>

        <div class="field">
          <label>Topic</label>
          <div class="auto-hint">${topicHint}</div>
          <select data-field="topic" onchange="updateField(this)">
            ${TOPICS.map(t => `<option value="${t}" ${(anno.topic || item.human.topic) === t ? 'selected' : ''}>${t || '— select —'}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label>Affect</label>
          <div class="auto-hint">${affectHint}</div>
          <select data-field="affect" onchange="updateField(this)">
            ${AFFECTS.map(a => `<option value="${a}" ${(anno.affect || item.human.affect) === a ? 'selected' : ''}>${a || '— select —'}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label>Genre</label>
          <div class="auto-hint">${genreHint}</div>
          <select data-field="genre" onchange="updateField(this)">
            ${GENRES.map(g => `<option value="${g}" ${(anno.genre || item.human.auto_genre || '') === g ? 'selected' : ''}>${g || '— select —'}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label>Key entities</label>
          <div class="hint">People, places, products, songs, brands mentioned (comma-separated)</div>
          <input type="text" data-field="key_entities" oninput="updateField(this)"
            value="${escAttr(anno.key_entities || '')}" placeholder="e.g. Gordon Ramsay, grilled cheese, sourdough">
        </div>

        <div class="field">
          <label>Save reason *</label>
          <div class="hint">Why did you save this? What would you come back for?</div>
          <textarea rows="2" data-field="save_reason" oninput="updateField(this)">${anno.save_reason || ''}</textarea>
        </div>
      </div>

      ${deepHtml}
    </div>
  </div>`;

  document.getElementById('content').innerHTML = html;
  document.getElementById('content').scrollTop = 0;
  updateProgress();
}

function updateField(el) {
  const item = COLLECTIONS[currentColl][currentItemIdx];
  const anno = getAnno(item.id);
  anno[el.dataset.field] = el.value;
  save();
  // Update pip annotation status
  const pip = document.querySelectorAll('.item-pip')[currentItemIdx];
  if (pip) {
    if (isAnnotated(item.id)) pip.classList.add('annotated');
    else pip.classList.remove('annotated');
  }
  updateProgress();
  renderSidebar();
}

function updateProgress() {
  const total = ITEMS.length;
  const done = totalAnnotated();
  document.getElementById('prog').textContent = `${done}/${total} annotated`;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return s.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Navigation
function prevItem() {
  const items = COLLECTIONS[currentColl];
  if (currentItemIdx > 0) { currentItemIdx--; renderContent(); }
  else {
    // Go to previous collection
    const ci = COLL_NAMES.indexOf(currentColl);
    if (ci > 0) {
      currentColl = COLL_NAMES[ci - 1];
      currentItemIdx = COLLECTIONS[currentColl].length - 1;
      renderSidebar();
      renderContent();
    }
  }
}

function nextItem() {
  const items = COLLECTIONS[currentColl];
  if (currentItemIdx < items.length - 1) { currentItemIdx++; renderContent(); }
  else {
    // Go to next collection
    const ci = COLL_NAMES.indexOf(currentColl);
    if (ci < COLL_NAMES.length - 1) {
      currentColl = COLL_NAMES[ci + 1];
      currentItemIdx = 0;
      renderSidebar();
      renderContent();
    }
  }
}

// Export: merge annotations back into template format
function exportAnnotations() {
  const output = ITEMS.map(item => {
    const anno = annotations[item.id] || {};
    const merged = JSON.parse(JSON.stringify(item));

    // Merge human fields
    if (anno.description) merged.human.description = anno.description;
    if (anno.search_queries) merged.human.search_queries = anno.search_queries.split(',').map(s => s.trim()).filter(Boolean);
    if (anno.topic) merged.human.topic = anno.topic;
    if (anno.affect) merged.human.affect = anno.affect;
    if (anno.genre) merged.human.genre = anno.genre;
    if (anno.key_entities) merged.human.key_entities = anno.key_entities.split(',').map(s => s.trim()).filter(Boolean);
    if (anno.save_reason) merged.human.save_reason = anno.save_reason;

    // Merge deep fields
    if (merged.human_deep !== null) {
      if (anno.deep_entities) merged.human_deep.entities = anno.deep_entities.split('\n').filter(Boolean);
      if (anno.deep_per_slide) merged.human_deep.per_slide = anno.deep_per_slide;
      if (anno.deep_actual_audio) merged.human_deep.actual_audio = anno.deep_actual_audio;
      if (anno.deep_cultural_context) merged.human_deep.cultural_context = anno.deep_cultural_context;
      if (anno.deep_structured_type) merged.human_deep.structured_type = anno.deep_structured_type;
      if (anno.deep_structured_items) merged.human_deep.structured_items = anno.deep_structured_items.split('\n').filter(Boolean);
    }

    return merged;
  });

  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'golden_set_annotated.json';
  a.click();
}

// Import previous annotations
function importAnnotations() {
  document.getElementById('importFile').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);

      // Handle two formats: raw annotations dict or full template array
      if (Array.isArray(data)) {
        // Full template — extract annotations from human fields
        data.forEach(item => {
          const anno = {};
          const h = item.human || {};
          if (h.description) anno.description = h.description;
          if (h.search_queries && h.search_queries.length) anno.search_queries = h.search_queries.join(', ');
          if (h.topic && h.topic !== item.human?.auto_topic) anno.topic = h.topic;
          if (h.affect) anno.affect = h.affect;
          if (h.genre) anno.genre = h.genre;
          if (h.key_entities && h.key_entities.length) anno.key_entities = h.key_entities.join(', ');
          if (h.save_reason) anno.save_reason = h.save_reason;

          const d = item.human_deep;
          if (d) {
            if (d.entities && d.entities.length) anno.deep_entities = d.entities.join('\n');
            if (d.per_slide) anno.deep_per_slide = d.per_slide;
            if (d.actual_audio) anno.deep_actual_audio = d.actual_audio;
            if (d.cultural_context) anno.deep_cultural_context = d.cultural_context;
            if (d.structured_type) anno.deep_structured_type = d.structured_type;
            if (d.structured_items && d.structured_items.length) anno.deep_structured_items = d.structured_items.join('\n');
          }

          if (Object.keys(anno).length) annotations[item.id] = anno;
        });
      } else {
        // Raw annotations dict
        Object.assign(annotations, data);
      }

      save();
      renderSidebar();
      renderContent();
      alert(`Imported annotations for ${Object.keys(annotations).length} items`);
    } catch (err) {
      alert('Failed to parse JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  // Don't intercept when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

  if (e.key === 'ArrowLeft') { e.preventDefault(); prevItem(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nextItem(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); exportAnnotations(); }
});

// Init
renderSidebar();
renderContent();
</script>
