name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: src/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linting (ruff check)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for source files
        id: check-src
        run: |
          if [ -d "src" ] || [ -d "app" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "No frontend source files yet — skipping checks"
          fi

      - name: Set up Node.js 20
        if: steps.check-src.outputs.has_source == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        if: steps.check-src.outputs.has_source == 'true'
        run: npm ci

      - name: Run linting
        if: steps.check-src.outputs.has_source == 'true'
        run: npm run lint

      - name: Run type checking
        if: steps.check-src.outputs.has_source == 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.check-src.outputs.has_source == 'true'
        run: npm test --if-present

      - name: Build application
        if: steps.check-src.outputs.has_source == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

  lambdas:
    name: Lambdas (SAM Validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Validate SAM template
        run: sam validate --lint
