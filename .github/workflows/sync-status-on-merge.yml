# Auto Status Sync on PR Merge
# Updates spec files and Dev Guide when PRs are merged
#
# Trigger: PR closed + merged
# Logic:
#   1. Extract task ID from PR title/branch (e.g., "feat(scope): 2.1 - ..." or "feature/2-2.1-...")
#   2. Find spec file: docs/MVP/tasks/specs/{epic}-{task}.md
#   3. Update spec: Status: DONE, Merged: Yes (PR #XX)
#   4. Update Dev Guide status table row
#   5. Commit: "docs: update status for {task_id} merge (PR #XX)"

name: Sync Status on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  sync-status:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Task ID
        id: extract
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          # Try to extract task ID from PR title first
          # Patterns: "feat(scope): 2.1 - description" or "feat: 2.1 - description"
          TASK_ID=""

          # Pattern 1: "feat(scope): X.Y - description" or "fix(scope): X.Y - description"
          if [[ "$PR_TITLE" =~ ^[a-z]+(\([^)]+\))?:[[:space:]]*([0-9]+\.[0-9]+) ]]; then
            TASK_ID="${BASH_REMATCH[2]}"
            echo "Extracted task ID from title: $TASK_ID"
          fi

          # Pattern 2: fallback to branch name "feature/X-X.Y-description" or "fix/X-X.Y-description"
          if [ -z "$TASK_ID" ]; then
            if [[ "$PR_BRANCH" =~ ^(feature|fix)/([0-9]+)-([0-9]+\.[0-9]+) ]]; then
              TASK_ID="${BASH_REMATCH[3]}"
              echo "Extracted task ID from branch: $TASK_ID"
            fi
          fi

          # Pattern 3: branch "feature/X-X.Y-X.Z-description" (epic-task format)
          if [ -z "$TASK_ID" ]; then
            if [[ "$PR_BRANCH" =~ ^(feature|fix)/([0-9]+)-([0-9]+)\.([0-9]+) ]]; then
              EPIC="${BASH_REMATCH[2]}"
              MAJOR="${BASH_REMATCH[3]}"
              MINOR="${BASH_REMATCH[4]}"
              TASK_ID="${MAJOR}.${MINOR}"
              echo "Extracted task ID from branch (epic format): $TASK_ID"
            fi
          fi

          if [ -z "$TASK_ID" ]; then
            echo "No task ID found in PR title or branch name"
            echo "PR Title: $PR_TITLE"
            echo "PR Branch: $PR_BRANCH"
            echo "task_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Parse epic and task number
          EPIC=$(echo "$TASK_ID" | cut -d. -f1)
          TASK_NUM=$(echo "$TASK_ID" | cut -d. -f2)

          # Build spec file path
          SPEC_FILE="docs/MVP/tasks/specs/${EPIC}-${TASK_ID}.md"

          if [ ! -f "$SPEC_FILE" ]; then
            echo "Spec file not found: $SPEC_FILE"
            echo "task_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "task_found=true" >> $GITHUB_OUTPUT
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "epic=$EPIC" >> $GITHUB_OUTPUT
          echo "spec_file=$SPEC_FILE" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          echo "Task ID: $TASK_ID"
          echo "Epic: $EPIC"
          echo "Spec file: $SPEC_FILE"

      - name: Update Spec File
        if: steps.extract.outputs.task_found == 'true'
        env:
          SPEC_FILE: ${{ steps.extract.outputs.spec_file }}
          PR_NUMBER: ${{ steps.extract.outputs.pr_number }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
        run: |
          set -e
          TODAY=$(date +%Y-%m-%d)

          echo "Updating spec file: $SPEC_FILE"

          # Update Status to DONE
          sed -i "s/^\*\*Status\*\*: .*/\*\*Status\*\*: DONE/" "$SPEC_FILE"

          # Update Merged to Yes with PR number
          sed -i "s/^\*\*Merged\*\*: .*/\*\*Merged\*\*: Yes (PR #${PR_NUMBER})/" "$SPEC_FILE"

          # Update Last Updated date
          sed -i "s/^\*\*Last Updated\*\*: .*/\*\*Last Updated\*\*: ${TODAY}/" "$SPEC_FILE"

          echo "Spec file updated successfully"

      - name: Update Dev Guide
        if: steps.extract.outputs.task_found == 'true'
        env:
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          EPIC: ${{ steps.extract.outputs.epic }}
        run: |
          set -e
          DEV_GUIDE="docs/MVP/tasks/Attic_MVP_Dev_Guide_v1.3.0.md"

          if [ ! -f "$DEV_GUIDE" ]; then
            echo "Dev Guide not found: $DEV_GUIDE"
            exit 1
          fi

          echo "Updating Dev Guide for task $TASK_ID"

          # Update the status table row for this task
          # Pattern: "| X.Y | STATUS | Merged | ..." -> "| X.Y | DONE | Yes | ..."
          # We need to match the row and update Status and Merged columns

          # Use awk for more precise table row updates
          awk -v task="$TASK_ID" '
          BEGIN { FS="|"; OFS="|" }
          {
            # Check if this is a table row containing our task
            if (NF >= 4) {
              # Clean up the task column for comparison
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              if ($2 == task) {
                # Update Status column (column 3)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3)
                $3 = " DONE "
                # Update Merged column (column 4)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $4)
                $4 = " Yes "
              }
            }
            print
          }
          ' "$DEV_GUIDE" > "${DEV_GUIDE}.tmp" && mv "${DEV_GUIDE}.tmp" "$DEV_GUIDE"

          echo "Dev Guide updated successfully"

      - name: Commit Changes
        if: steps.extract.outputs.task_found == 'true'
        env:
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_NUMBER: ${{ steps.extract.outputs.pr_number }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "docs: update status for ${TASK_ID} merge (PR #${PR_NUMBER})"
          git push origin main

          echo "Changes committed and pushed"

      - name: Summary
        if: steps.extract.outputs.task_found == 'true'
        env:
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          SPEC_FILE: ${{ steps.extract.outputs.spec_file }}
          PR_NUMBER: ${{ steps.extract.outputs.pr_number }}
        run: |
          echo "## Status Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Task**: ${TASK_ID}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${PR_NUMBER}" >> $GITHUB_STEP_SUMMARY
          echo "- **Spec file**: ${SPEC_FILE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Updated to DONE" >> $GITHUB_STEP_SUMMARY
          echo "- **Merged**: Yes" >> $GITHUB_STEP_SUMMARY

      - name: No Task Found Summary
        if: steps.extract.outputs.task_found != 'true'
        run: |
          echo "## Status Sync Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No task ID found in PR title or branch name." >> $GITHUB_STEP_SUMMARY
          echo "This is normal for non-task PRs (e.g., dependency updates, docs-only changes)." >> $GITHUB_STEP_SUMMARY
